<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GradeGoal: Schulnoten &amp; Grades</title>
  <meta name="description" content="Zeugnisnoten eintragen, Durchschnitte berechnen, Wunschnoten erreichen. / Track grades, calculate averages, reach your goals." />
  <meta name="theme-color" content="#EEF2F7" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />

  <!--
    Design VOR dem ersten Rendern setzen. React kennt den gespeicherten
    Zustand erst nach einem asynchronen Lesevorgang; ohne dieses Skript
    blitzt bei jedem Start kurz die helle Oberflaeche auf, bevor auf
    Dunkel umgeschaltet wird. Bewusst inline und mit try/catch, damit ein
    gesperrter localStorage (privater Modus) den Start nicht blockiert.
  -->
  <script>
    (function () {
      var dark = false;
      try {
        var raw = localStorage.getItem("gradegoal:data");
        var theme = "system";
        if (raw) {
          var s = JSON.parse(raw);
          theme = s.theme || (s.dark === true ? "dark" : s.dark === false ? "light" : "system");
        }
        dark = theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      } catch (e) { /* Standard bleibt hell */ }
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", dark ? "#101826" : "#EEF2F7");
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <!--
    Startwaechter: Bleibt die App nach einigen Sekunden leer (z. B. weil
    ein Skript schon beim Laden scheitert), erscheint statt eines leeren
    Bildschirms ein Hinweis mit den aufgefangenen Fehlern. Bewusst ohne
    Abhaengigkeiten, damit er auch dann funktioniert.
  -->
  <script>
    (function () {
      var errs = [];
      window.addEventListener("error", function (e) {
        errs.push((e.message || "Fehler") + (e.filename ? " @" + String(e.filename).slice(-40) + ":" + e.lineno : ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason; errs.push("Promise: " + (r && (r.message || r)) );
      });
      setTimeout(function () {
        var app = document.getElementById("app");
        if (!app || app.childNodes.length) return;
        var box = document.createElement("div");
        box.style.cssText = "font:15px/1.5 -apple-system,sans-serif;padding:calc(40px + env(safe-area-inset-top)) 24px 24px;color:#172A46;background:#EEF2F7;min-height:100vh;box-sizing:border-box";
        box.innerHTML = "<h2 style='margin:0 0 8px'>GradeGoal startet nicht</h2>" +
          "<p>Bitte diesen Bildschirm fotografieren und an den Entwickler senden.</p>";
        var pre = document.createElement("pre");
        pre.style.cssText = "white-space:pre-wrap;font-size:12px;background:#fff;padding:10px;border-radius:8px";
        pre.textContent = (errs.length ? errs.join("\n") : "(keine Fehlermeldung aufgefangen)") + "\n\n" + navigator.userAgent;
        box.appendChild(pre);
        document.body.appendChild(box);
      }, 6000);
    })();
  </script>
  <div id="print"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
