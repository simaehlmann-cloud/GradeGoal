name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

# Test-APK bei jedem Push. Seit 1.8.0 gibt es nur noch EINE Ausgabe
# (Gratis-Rahmen + In-App-Kauf statt Lite und Pro).
#
# Sind die Keystore-Secrets hinterlegt, wird die APK mit dem Release-
# Schlüssel signiert und bekommt die Laufnummer als versionCode. Dann
# laesst sie sich ueber eine aeltere Test-APK installieren. Ohne Secrets
# entsteht wie bisher eine Debug-APK.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Signierung vorbereiten (falls Secrets vorhanden)
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "Keine Keystore-Secrets – baue Debug-APK."
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          VERSION=$(node -p "require('./package.json').version")
          chmod +x tools/prepare-release.sh
          tools/prepare-release.sh "$VERSION" "${{ github.run_number }}"
          echo "mode=release" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android && chmod +x gradlew
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../gradegoal.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../gradegoal.apk
          fi

      - name: Keystore wieder entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gradegoal-apk-${{ steps.sign.outputs.mode }}-${{ github.run_number }}
          path: gradegoal.apk
