name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

# Baut BEIDE Ausgaben. Jeder Matrix-Lauf startet in einem frischen
# Arbeitsverzeichnis, deshalb koennen sich Lite und Pro hier nicht in
# die Quere kommen - anders als lokal, wo dist/ und android/ vor dem
# Wechsel geleert werden muessen.

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: lite
            script: build
            config: capacitor.config.json
          - tier: pro
            script: "build:pro"
            config: capacitor.config.pro.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Konfiguration und Bildmaterial waehlen (${{ matrix.tier }})
        # Fuer Lite liegt die Konfiguration schon richtig - cp weigert
        # sich, eine Datei auf sich selbst zu kopieren. Dafuer kommt dort
        # das Bildmaterial mit dem LITE-Streifen zum Einsatz.
        run: |
          if [ "${{ matrix.config }}" != "capacitor.config.json" ]; then
            cp "${{ matrix.config }}" capacitor.config.json
          else
            cp -r assets-lite/. assets/
            cp public/icon-lite.svg public/icon.svg
          fi
          echo "Verwendete App-ID:"
          grep appId capacitor.config.json

      - name: Build web app (${{ matrix.tier }})
        run: npm run ${{ matrix.script }}

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gradegoal-${{ matrix.tier }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
