name: iOS – Zertifikat erstellen

# EINMALIG ausfuehren. Erzeugt ueber den App-Store-Connect-API-Schluessel
# ein "Apple Distribution"-Zertifikat samt privatem Schluessel und packt
# beides in eine kennwortgeschuetzte .p12-Datei.
#
# Ergebnis: Artefakt "zertifikat-base64" mit einer Textzeile. Diese als
# Secret IOS_DIST_P12_BASE64 eintragen, dann das Artefakt loeschen.
#
# Voraussetzung: Secret IOS_DIST_P12_PASSWORD (selbst gewaehltes, langes
# Kennwort). Ohne dieses Kennwort ist die .p12-Datei nutzlos – auch fuer
# jemanden, der das Artefakt herunterlaedt.

on:
  workflow_dispatch:

jobs:
  certificate:
    runs-on: ubuntu-latest
    steps:
      - name: Zugangsdaten pruefen
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$KID" ] && MISSING="$MISSING ASC_KEY_ID"
          [ -z "$ISS" ] && MISSING="$MISSING ASC_ISSUER_ID"
          [ -z "$P8" ]  && MISSING="$MISSING ASC_KEY_P8_BASE64"
          [ -z "$PW" ]  && MISSING="$MISSING IOS_DIST_P12_PASSWORD"
          if [ -n "$MISSING" ]; then echo "FEHLER: Secrets fehlen:$MISSING"; exit 1; fi
          [ ${#PW} -ge 12 ] || { echo "FEHLER: IOS_DIST_P12_PASSWORD bitte mindestens 12 Zeichen lang waehlen."; exit 1; }

      - name: Schluessel und Zertifikatsanfrage erzeugen
        run: |
          cd "$RUNNER_TEMP"
          openssl genrsa -out dist.key 2048 2>/dev/null
          openssl req -new -key dist.key -subj "/CN=GradeGoal Distribution/C=DE" -out dist.csr
          echo "Zertifikatsanfrage erstellt."

      - name: Zertifikat bei Apple anlegen
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          pip install --quiet pyjwt cryptography
          cd "$RUNNER_TEMP"
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error, jwt
          key = base64.b64decode(os.environ["P8"]).decode()
          token = jwt.encode(
              {"iss": os.environ["ISS"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["KID"], "typ": "JWT"})
          body = {"data": {"type": "certificates", "attributes": {
              "certificateType": "DISTRIBUTION", "csrContent": open("dist.csr").read()}}}
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/certificates",
              data=json.dumps(body).encode(), method="POST",
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
          try:
              res = json.load(urllib.request.urlopen(req))
          except urllib.error.HTTPError as e:
              print("FEHLER von Apple (HTTP %s):" % e.code)
              for err in json.load(e).get("errors", []):
                  print(" -", err.get("title"), "|", err.get("detail"))
              print("Bei 'maximum number of certificates': unter developer.apple.com → Certificates")
              print("ein nicht mehr benoetigtes 'Apple Distribution'-Zertifikat widerrufen.")
              raise SystemExit(1)
          a = res["data"]["attributes"]
          open("dist.cer", "wb").write(base64.b64decode(a["certificateContent"]))
          print("Zertifikat angelegt:", a.get("name"), "| gueltig bis", a.get("expirationDate"))
          PY

      - name: In .p12 verpacken
        env:
          PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          cd "$RUNNER_TEMP"
          openssl x509 -inform DER -in dist.cer -out dist.pem
          # Klassische Verschluesselung, damit die macOS-Schluesselbundverwaltung
          # die Datei sicher lesen kann.
          openssl pkcs12 -export -inkey dist.key -in dist.pem -name "GradeGoal Distribution" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
            -passout env:PW -out dist.p12
          openssl pkcs12 -in dist.p12 -passin env:PW -nokeys -noout -legacy 2>/dev/null \
            || openssl pkcs12 -in dist.p12 -passin env:PW -nokeys -noout
          mkdir -p out
          base64 -w0 dist.p12 > out/IOS_DIST_P12_BASE64.txt
          rm -f dist.key dist.p12
          echo "Fertig: $(wc -c < out/IOS_DIST_P12_BASE64.txt) Zeichen."

      - name: Ergebnis bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: zertifikat-base64
          path: ${{ runner.temp }}/out/IOS_DIST_P12_BASE64.txt
          retention-days: 1
